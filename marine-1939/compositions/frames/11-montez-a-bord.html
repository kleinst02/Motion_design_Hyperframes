<template>
  <div id="root" data-composition-id="11-montez-a-bord" data-width="1920" data-height="1080" data-duration="7.74">
    <link rel="stylesheet" href="assets/carte/mx-kit.css">
    <style>
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Archivo Black"; src: url("assets/fonts/ArchivoBlack-400.woff2") format("woff2"); font-weight: 400; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; -webkit-font-smoothing: antialiased; }

      /* the ground under the iris is black; the stage carries the iris (a circle around the button center, screen space) */
      #p11-ground { background: #000; }
      #p11-stage { clip-path: circle(1250px at 960px 742px); }
      #p11-shake { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      /* no world in this frame: the end card takes its place under the camera. Its living advance is a scale around the
         button center (960, 742), the point where the iris closes */
      #p11-card { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 742px; }

      /* the body of the Toulon article (#141414) still fills the frame at t = 0 (handoff_in) */
      #p11-cover { background: #141414; }

      /* everything of the blog card waits, hidden */
      #p11-header, #p11-btn, #p11-url, #p11-cursor { opacity: 0; }
      #p11-tag .p11-w { display: inline-block; opacity: 0; }

      /* the banner: the photo is never redrawn; a copy of it, masked to its sea, breathes (scale 1 to 1.01) around the
         waterline of the ship, so the ship and the title stay still */
      #p11-header { overflow: hidden; }
      #p11-sea { position: absolute; left: 0; top: 0; width: 1080px; height: 395px; background-image: inherit; background-size: inherit;
        background-position: inherit; transform-origin: 250px 360px;
        -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 280px, #000 340px); mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 280px, #000 340px); }

      /* the button: no hard shadow before it touches the page; its sheen runs under the words, inside its rounded box */
      #p11-btn { box-shadow: 0px 0px 0px 0px rgba(27, 26, 23, 0); }
      #p11-btn span { position: relative; }
      #p11-sheenclip { position: absolute; left: 0; top: 0; width: 400px; height: 104px; border-radius: 8px; overflow: hidden; }
      #p11-sheen { position: absolute; left: 0; top: 0; width: 400px; height: 104px;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, .6) 50%, rgba(255, 255, 255, 0) 60%); }

      /* the address, same place (centered on 960), in a box narrow enough to be blurred at its arrival */
      #p11-url { left: 660px; width: 600px; }

      /* the arrow presses on its tip */
      #p11-cursor { transform-origin: 5px 5px; }
    </style>

    <!-- the ground (black under the iris); inside it the stage, the shake wrapper and the end card in place of the world -->
    <div id="p11-ground" class="clip mx-ground" data-start="0" data-duration="7.74" data-track-index="0" data-layout-allow-overflow data-layout-allow-caption-zone>
      <div id="p11-stage" class="mx-stage" data-layout-allow-overflow>
        <div id="p11-shake" data-layout-allow-overflow>
          <div id="p11-card" data-layout-allow-overflow data-layout-allow-caption-zone></div>
        </div>
      </div>
    </div>

    <!-- film grain: 5 % (the day grain of sequence 10, handoff_in), then the 6 % grain of the blog from 0.07 -->
    <div id="p11-grain" class="clip mx-grain day" data-start="0" data-duration="7.74" data-track-index="1"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/carte/mx-data.js"></script>
    <script src="assets/carte/mx-kit.js"></script>
    <script>
      (function () {
        var FID = "11-montez-a-bord", DUR = 7.74, T0 = MX.FRAMES[10][1];     // film time T = T0 + local time (42.36)
        var $ = function (id) { return document.getElementById(id); };
        var YEL = MX.C.accent, PRESS = MX.C.accentPress, FLASH = MX.C.accentFlash;

        /* ============================== the DOM, built once ============================== */
        var stage = $("p11-stage"), card = $("p11-card"), grain = $("p11-grain");
        card.insertAdjacentHTML("beforeend", MX.endCardHTML("p11", "assets/img/"));
        var ground = $("p11-endground"), header = $("p11-header"), tag = $("p11-tag"), btn = $("p11-btn"), url = $("p11-url"), cursor = $("p11-cursor");
        ground.setAttribute("data-layout-allow-overflow", "");

        // the plain #141414 of the article, over the striped ground, until the stripes come out of it
        ground.insertAdjacentHTML("afterend", '<div id="p11-cover" class="mx-layer" data-layout-allow-occlusion data-layout-allow-overflow></div>');
        var cover = $("p11-cover");

        // the banner: its photo's sea, a masked copy of the same image
        header.insertAdjacentHTML("beforeend", '<div id="p11-sea" data-layout-allow-occlusion></div>');
        var sea = $("p11-sea");

        // the tagline, one span per word (same line, same centering: hidden words keep their place)
        var TAGW = tag.textContent.split(" ");
        tag.innerHTML = TAGW.map(function (w, i) { return '<span class="p11-w" id="p11-w' + i + '">' + MX.esc(w) + "</span>"; }).join(" ");
        var tagWords = Array.prototype.slice.call(tag.querySelectorAll(".p11-w"));

        // the button: the sheen under its words ; the reference band (100deg, 20 % wide, peak 0.6) runs from x = -30 % to
        // 130 % of the gradient line ; the band element is the button box, its peak at 50 %, moved along x
        btn.insertAdjacentHTML("afterbegin", '<div id="p11-sheenclip" data-layout-allow-occlusion><div id="p11-sheen" data-layout-allow-occlusion></div></div>');
        btn.querySelector("span").setAttribute("data-layout-allow-overlap", "");
        btn.setAttribute("data-layout-allow-overlap", "");
        var sheen = $("p11-sheen"), A = 100 * Math.PI / 180, GL = 400 * Math.sin(A) + 104 * Math.abs(Math.cos(A)), SK = GL / 100 / Math.sin(A);
        var SX0 = (-30 - 40) * SK, SX1 = (130 - 40) * SK;

        // the three rings around the button, the arrow over it
        var rings = Array.prototype.slice.call($("p11-rings").querySelectorAll("i"));
        $("p11-rings").setAttribute("data-layout-allow-overlap", "");
        $("p11-rings").setAttribute("data-layout-allow-occlusion", "");
        rings.forEach(function (r) { r.setAttribute("data-layout-allow-overlap", ""); r.setAttribute("data-layout-allow-occlusion", ""); });
        cursor.setAttribute("data-layout-allow-overlap", "");
        cursor.setAttribute("data-layout-allow-occlusion", "");
        url.setAttribute("data-layout-allow-caption-zone", "");

        // start states (identity baselines where GSAP takes over a transform)
        gsap.set(card, { scale: 1 });
        gsap.set(ground, { scale: 1.15, filter: "blur(8px)" });
        gsap.set(header, { x: 0, scale: 1.15, filter: "blur(10px)" });
        gsap.set(sea, { scale: 1 });
        gsap.set(tagWords, { y: 6 });
        gsap.set(btn, { scale: 1.25, filter: "blur(12px)" });
        gsap.set(sheen, { x: SX0 });
        gsap.set(url, { scale: 1.1, filter: "blur(6px)" });
        gsap.set(rings, { scale: 1 });
        gsap.set(cursor, { x: 1500, y: 1060, scale: 1 });

        /* ============================== the timeline ============================== */
        // Ease names: the storyboard names curves like the kit (powerN = u^N); GSAP's powerN is u^(N+1), so a storyboard
        // « power2.in » is GSAP power1.in and a « power3.out » is GSAP power2.out ; expo.out is the same.
        var tl = gsap.timeline({ paused: true });
        var ft = function (t, a, b, at) { b.immediateRender = false; return tl.fromTo(t, a, b, at); };

        // no camera score here (MX.camAt is null after 42.36): ONE proxy tween still runs render(T) on every seek, for the
        // grain (offset from the image number, as in every sequence; the 5 % day grain of sequence 10 until the blog arrives)
        var cam = { t: T0 }, lastDay = null;
        function render(T) {
          var n = Math.round(T * 30);
          grain.style.backgroundPosition = ((n * 97) % 240) + "px " + ((n * 151) % 240) + "px";
          var day = T < T0 + 0.07;
          if (day !== lastDay) { grain.classList.toggle("day", day); lastDay = day; }
        }
        ft(cam, { t: T0 }, { t: T0 + DUR, duration: DUR, ease: "none", onUpdate: function () { render(cam.t); },
          modifiers: { t: function (v) { render(+v); return v; } } }, 0);

        // ---- the living layer (all linear, one pass): the card advances +0.6 %/s, the banner glides 4 px/s to the left
        ft(card, { scale: 1 }, { scale: 1 + 0.006 * DUR, duration: DUR, ease: "none" }, 0);
        ft(header, { x: 0 }, { x: -4 * DUR, duration: DUR, ease: "none" }, 0);

        // ---- scene 1: the black of the article becomes the blog
        // 0.07 to 0.27 the striped ground comes out of the plain #141414: it arrives from the camera (x1.15, blur 8, expo.out)
        ft(ground, { scale: 1.15, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, 0.07);
        tl.set(ground, { filter: "none" }, 0.271);
        ft(cover, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "expo.out" }, 0.07);
        // 0.30 to 0.46 the banner arrives from the camera (x1.15, blur 10, expo.out), set on « MARINE » (0.46)
        ft(header, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 0.30);
        ft(header, { scale: 1.15, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out" }, 0.30);
        tl.set(header, { filter: "none" }, 0.461);
        // 1.00 « 1939 »: the tagline prints word by word, one word every 0.07 s (each entrance starts one image early)
        function words(list, t0, step) {
          list.forEach(function (el, i) {
            ft(el, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.1, ease: "power2.out" }, t0 + step * i);
          });
        }
        words(tagWords, 0.97, 0.07);

        // ---- scene 2: the button, the click
        // 2.40 the button arrives from the camera like the 4e (x1.25, blur 12, « power2.in » = GSAP power1.in, 0.15 s)
        ft(btn, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 2.399);
        ft(btn, { scale: 1.25, filter: "blur(12px)" }, { scale: 1, filter: "blur(0px)", duration: 0.15, ease: "power1.in" }, 2.40);
        tl.set(btn, { filter: "none" }, 2.551);
        // 2.55 it touches the page: it crushes (1.04 to 1 in 0.08 s) and its 8 px hard shadow appears
        ft(btn, { scale: 1.04 }, { scale: 1, duration: 0.08, ease: "power3.out" }, 2.55);
        ft(btn, { boxShadow: "0px 0px 0px 0px rgba(27, 26, 23, 0)" }, { boxShadow: "8px 8px 0px 0px rgba(27, 26, 23, 1)", duration: 0.001, ease: "none" }, 2.55);
        // 2.70 the address prints (x1.1, blur 6, 0.12 s)
        ft(url, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 2.70);
        ft(url, { scale: 1.1, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power2.out" }, 2.70);
        tl.set(url, { filter: "none" }, 2.821);
        // 2.85 to 3.28 the arrow arrives from the bottom right in ONE curved move: x and y on two curves (« power3.out » =
        // GSAP power2.out ; y adds the arc of the reference, 48 px at mid-course), and lands on « bord »
        var ARC = 48 / 318;
        var arcEase = function (p) { var e = 1 - Math.pow(1 - p, 3); return e + ARC * Math.sin(Math.PI * e); };
        ft(cursor, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 2.85);
        ft(cursor, { x: 1500 }, { x: 1030, duration: 0.43, ease: "power2.out" }, 2.85);
        ft(cursor, { y: 1060 }, { y: 742, duration: 0.43, ease: arcEase }, 2.85);
        // 3.28 « bord »: direct click. The arrow at 0.85 and the button at 0.97 for 0.05 s, then back to 1 in 0.08 s ; the
        // button in three colors: pressed #cdd32c (0.05 s), released #f5f8a8 (0.1 s), then its yellow (0.08 s, 3.51)
        ft(cursor, { scale: 1 }, { scale: 0.85, duration: 0.001, ease: "none" }, 3.28);
        ft(btn, { scale: 1 }, { scale: 0.97, duration: 0.001, ease: "none" }, 3.28);
        ft(btn, { backgroundColor: YEL }, { backgroundColor: PRESS, duration: 0.001, ease: "none" }, 3.28);
        ft(btn, { backgroundColor: PRESS }, { backgroundColor: FLASH, duration: 0.001, ease: "none" }, 3.33);
        ft(cursor, { scale: 0.85 }, { scale: 1, duration: 0.08, ease: "none" }, 3.33);
        ft(btn, { scale: 0.97 }, { scale: 1, duration: 0.08, ease: "none" }, 3.33);
        ft(btn, { backgroundColor: FLASH }, { backgroundColor: YEL, duration: 0.08, ease: "none" }, 3.43);
        // three yellow rings open around it (0.6 s each, 0.08 s apart)
        rings.forEach(function (r, k) {
          var s = 3.28 + 0.08 * k;
          ft(r, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, s);
          ft(r, { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.12, duration: 0.6, ease: "none" }, s + 0.001);
        });

        // ---- scene 3: the living hold, the iris
        // 3.90 the arrow moves 60 px away and fades (0.2 s)
        ft(cursor, { x: 1030 }, { x: 1090, duration: 0.2, ease: "none" }, 3.90);
        ft(cursor, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, 3.90);
        // 4.10 to 6.10 the sea of the banner photo breathes (1 to 1.01, once)
        ft(sea, { scale: 1 }, { scale: 1.01, duration: 2.0, ease: "none" }, 4.10);
        // 4.24 and 5.24 a light sheen runs along the button, left to right (1.0 s linear each)
        [4.24, 5.24].forEach(function (t) { ft(sheen, { x: SX0 }, { x: SX1, duration: 1.0, ease: "none" }, t); });
        // 6.24 the iris closes on the button (circle 1250 px to 0 around (960, 742), « power2.in » = GSAP power1.in). It is
        // shut at 7.70 so that the last image of the film (42.36 + 7.7067, at 30 fps) is black.
        ft(stage, { clipPath: "circle(1250px at 960px 742px)" }, { clipPath: "circle(0px at 960px 742px)", duration: 1.46, ease: "power1.in" }, 6.24);

        tl.set({}, {}, DUR);                                            // exact frame length

        render(T0);                                                     // first image = handoff_in, before any seek

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
</template>
