<template>
  <div id="root" data-composition-id="03-toulon" data-width="1920" data-height="1080" data-duration="4.03">
    <link rel="stylesheet" href="assets/carte/mx-kit.css">
    <style>
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-600.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "EB Garamond"; src: url("assets/fonts/EBGaramond-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "EB Garamond"; src: url("assets/fonts/EBGaramond-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "EB Garamond"; src: url("assets/fonts/EBGaramond-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "Space Mono"; src: url("assets/fonts/SpaceMono-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Space Mono"; src: url("assets/fonts/SpaceMono-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Archivo Black"; src: url("assets/fonts/ArchivoBlack-400.woff2") format("woff2"); font-weight: 400; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; -webkit-font-smoothing: antialiased; }

      /* the shake wrapper sits between .mx-stage and .mx-world (identity in this frame) */
      #p03-shake { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-style: preserve-3d; }

      /* the Strasbourg that escapes from Mers el-Kebir: its own sharp stage (same camera) until it berths at 10.33 ;
         then it is the fifth model of the common world, hidden until that image */
      #p03-st { visibility: hidden; }

      /* « 27·11·42 » : written letter by letter from 0.60 */
      #p03-pt .mx-pc { opacity: 0; }

      /* ripples that open during the frame (the berth, the five scuttlings) */
      .p03-rip { opacity: 0; }

      /* the lamp flickers at 1.70 : a veil of the table's black, 8 % at most (the light at 92 %) */
      #p03-flicker { background: #0c0906; opacity: 0; }

      /* the voice line, word by word */
      #p03-subs .mx-w { opacity: 0; }
      #p03-subs .mx-w.mx-box { opacity: 1; }
      #p03-subs .mx-box .mx-pt { opacity: 1; }
      #p03-subs .mx-box-tx { display: inline-block; opacity: 0; }
      #p03-subs .mx-box-bg { transform: scaleX(0); }
    </style>

    <!-- the table at night ; the common stage (the chart and its objects, the camera blur), then the escaping
         Strasbourg's own stage (sharp, same camera) -->
    <div id="p03-ground" class="clip mx-ground" data-start="0" data-duration="4.03" data-track-index="0" data-layout-allow-overflow>
      <div id="p03-stage" class="mx-stage" data-layout-allow-overflow>
        <div id="p03-shake" data-layout-allow-overflow>
          <div id="p03-world" class="mx-world" data-layout-allow-overflow></div>
        </div>
      </div>
      <div id="p03-stage2" class="mx-stage" data-layout-allow-overflow>
        <div id="p03-world2" class="mx-world" data-layout-allow-overflow></div>
      </div>
    </div>

    <!-- 2D lights over the stage : the night lamp, and its flicker -->
    <div id="p03-lights" class="clip mx-layer" data-start="0" data-duration="4.03" data-track-index="1">
      <div id="p03-flicker" class="mx-layer" data-layout-allow-occlusion></div>
    </div>

    <!-- the voice line, bottom center (band y 890 to 980) -->
    <div id="p03-subs" class="clip mx-layer" data-start="0" data-duration="4.03" data-track-index="2" data-layout-allow-caption-zone></div>

    <!-- film grain, 6 % -->
    <div id="p03-grain" class="clip mx-grain" data-start="0" data-duration="4.03" data-track-index="3"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/carte/mx-data.js"></script>
    <script src="assets/carte/mx-kit.js"></script>
    <script>
      (function () {
        var FID = "03-toulon", DUR = 4.03, T0 = MX.FRAMES[2][1], W = MX.W;          // film time T = T0 + local time
        var $ = function (id) { return document.getElementById(id); };
        var RIP = "#2f6c80";

        /* ============================== the DOM, built once ============================== */
        var stage = $("p03-stage"), shake = $("p03-shake"), world = $("p03-world"), stage2 = $("p03-stage2"), world2 = $("p03-world2");
        // an object laid on the chart : a .mx-on placed once (x, y, rotation in chart units)
        function onChart(parent, id, cls, html, x, y, rot) {
          var e = document.createElement("div");
          e.id = id;
          e.className = "mx-on" + (cls ? " " + cls : "");
          e.innerHTML = html;
          parent.appendChild(e);
          gsap.set(e, { x: x, y: y, rotation: rot || 0, scale: 1 });
          return e;
        }
        function model(parent, id, m, cls) { return onChart(parent, id, cls, MX.modelHTML(m[0], m[3], id + "-m"), m[1], m[2], m[4]); }
        function ripples(id, x, y, r0, step, cls) { return onChart(world, id, cls, MX.ripplesSVG(3, r0, step, RIP, 0.85), x, y, 0); }

        // the world, in the order of the reference (reference/carte.html, buildMed)
        world.insertAdjacentHTML("beforeend", MX.chartSVG("med", "p03-med"));
        world.insertAdjacentHTML("beforeend", MX.bookHTML("p03-a", W.BOOK_A, MX.pageVersoSVG("p03-av"), MX.pageEngravingSVG("p03-ae", true)));
        onChart(world, "p03-pmk", "", MX.pencilSVG("3·7·40", 44), W.PENCIL_MK[0], W.PENCIL_MK[1], 0);          // written in sequence 2
        onChart(world, "p03-lmk", "", MX.lossRingSVG("p03-lmk-e", W.LOSS_MK[2], W.LOSS_MK[3], W.LOSS_MK[4]), W.LOSS_MK[0], W.LOSS_MK[1], 0);
        $("p03-lmk-e").setAttribute("stroke-dashoffset", "0");                                                     // the red ring of the Bretagne, drawn
        var pencilT = onChart(world, "p03-pt", "", MX.pencilSVG("27·11·42", 44), W.PENCIL_TOULON[0], W.PENCIL_TOULON[1], 0);
        var pcs = pencilT.querySelectorAll(".mx-pc");
        [2, 3, 4].forEach(function (i) { model(world, "p03-ln" + i, W.LINE[i]); });                                // the line of 1939, afloat
        model(world, "p03-mk0", W.MK[0]);                                                                         // the Dunkerque and the Provence, moored
        model(world, "p03-mk1", W.MK[1]);
        var salvo = ripples("p03-sv2", 980, 3010, 14, 10);                                                        // the last salvo's rings (8.37)
        var leave = ripples("p03-rmk", W.MK[3][1], W.MK[3][2], 60, 30);                                           // the Strasbourg left its berth (8.82)
        var TB = W.TOULON[4];
        var berth = ripples("p03-rb", TB[1], TB[2], 60, 30, "p03-rip");                                           // it berths at Toulon (10.33)
        var st = model(world, "p03-st", ["bb", TB[1], TB[2], 230, TB[4]]);                                        // the Strasbourg in the common world
        var fleet = [], rings = [];
        [0, 1, 2, 3].forEach(function (i) {
          fleet.push(model(world, "p03-t" + i, W.TOULON[i]));
          rings.push(ripples("p03-r" + i, W.TOULON[i][1], W.TOULON[i][2], 60, 30, "p03-rip"));
        });
        fleet.push(st);
        rings.push(ripples("p03-r4", TB[1], TB[2], 60, 30, "p03-rip"));

        // the escaping Strasbourg, alone in its own sharp stage (MX.strasAt)
        var st2 = model(world2, "p03-s2", ["bb", TB[1], TB[2], 230, TB[4]]);

        // lights : the night lamp under its flicker veil
        var flicker = $("p03-flicker");
        flicker.insertAdjacentHTML("beforebegin", MX.lampHTML(960, 480, 980, 580));

        // the voice line : one chunk, theme .night
        var subs = $("p03-subs");
        var S1 = [["Novembre", 0.27], ["1942 :", 0.96], ["Toulon", 2.44, "box"]];
        subs.innerHTML = MX.subHTML("p03-s1", S1.map(function (w) { return [w[0], w[2] || ""]; }).concat([[".", ""]]), "night");
        var s1 = $("p03-s1");

        var grain = $("p03-grain");

        /* ============================== the timeline ============================== */
        // Ease names : the storyboard and frame.md name curves like the kit : powerN = u^N ; GSAP writes power(N-1).
        var tl = gsap.timeline({ paused: true });
        var ft = function (t, a, b, at) { b.immediateRender = false; return tl.fromTo(t, a, b, at); };

        // the camera : ONE proxy tween over the whole frame, in film time (MX.camAt, MX.blurAt, MX.strasAt)
        var cam = { t: T0 };
        function render(T) {
          var c = MX.camAt(T);
          MX.applyCam(world, c);
          var b = MX.blurAt(T);
          stage.style.filter = b > 0.3 ? "blur(" + b + "px)" : "none";
          var esc = T < 10.33;                                          // 8.82 to 10.33 : the escape, in its own stage
          if (esc) {
            var q = MX.strasAt(T);
            gsap.set(st2, { x: q[0], y: q[1], rotation: q[2] });
            MX.applyCam(world2, c);
          }
          stage2.style.visibility = esc ? "inherit" : "hidden";
          st.style.visibility = esc ? "hidden" : "inherit";
          var n = Math.round(T * 30);                                   // grain : offset from the image number
          grain.style.backgroundPosition = ((n * 97) % 240) + "px " + ((n * 151) % 240) + "px";
        }
        ft(cam, { t: T0 }, { t: T0 + DUR, duration: DUR, ease: "none", onUpdate: function () { render(cam.t); },
          modifiers: { t: function (v) { render(+v); return v; } } }, 0);

        // rings in the water : the group grows x1 -> x1.35 and fades out in 1.0 s, linear (reference : ripples)
        function rip(el, t0) {
          var p0 = Math.max(0, -t0);                                    // rings already open at the seam
          if (p0 > 0) gsap.set(el, { opacity: 1 - p0, scale: 1 + 0.35 * p0 });
          ft(el, { opacity: 1 - p0, scale: 1 + 0.35 * p0 }, { opacity: 0, scale: 1.35, duration: 1.0 - p0, ease: "none" }, Math.max(0, t0));
        }
        rip(salvo, 8.37 - T0);
        rip(leave, 8.82 - T0);

        // ---- scene 1 : the chase to Toulon ; the date in pencil ; the Strasbourg berths (10.33)
        var PT = 9.92 - T0;                                             // 0.60, one letter every 0.12 s, each in 0.08 s
        for (var i = 0; i < pcs.length; i++) ft(pcs[i], { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, PT + 0.12 * i);
        rip(berth, 10.33 - T0);

        // ---- scene 2 : the moored fleet ; the lamp flickers (1.70) ; the five models shiver (2.00)
        ft(flicker, { opacity: 0 }, { opacity: 0.08, duration: 0.06, ease: "power1.out" }, 1.70);
        ft(flicker, { opacity: 0.08 }, { opacity: 0, duration: 0.14, ease: "power1.inOut" }, 1.76);
        fleet.forEach(function (on) {
          var m = on.querySelector(".mx-model");
          ft(m, { y: 0 }, { y: 0.7, duration: 0.025, ease: "none" }, 2.00);
          ft(m, { y: 0.7 }, { y: -0.7, duration: 0.05, ease: "none" }, 2.025);
          ft(m, { y: -0.7 }, { y: 0, duration: 0.025, ease: "none" }, 2.075);
        });

        // ---- scene 3 : the scuttling, east to west, each model in place (sink : 0.2 s « power2.in », then 1.0 s linear)
        var SINK = [11.42, 11.57, 11.72, 11.87, 12.02];
        fleet.forEach(function (on, k) {
          var t0 = SINK[k] - T0;
          ft(on, { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0.35, scale: 0.9, filter: "blur(3px)", duration: 0.2, ease: "power1.in" }, t0);
          ft(on, { opacity: 0.35, filter: "blur(3px)" }, { opacity: 0, filter: "blur(6px)", duration: 1.0, ease: "none" }, t0 + 0.2);
          tl.set(on, { filter: "none" }, t0 + 1.2);
          rip(rings[k], t0);
        });

        // ---- the voice line : « Novembre 1942 : [Toulon]. »
        var INK_N = "rgb(244, 237, 221)", GREY_N = "rgba(244, 237, 221, 0.35)";    // .night : #f4eddd
        var BOX = "rgb(17, 17, 17)", GREY_B = "rgba(17, 17, 17, 0.35)";            // in the box : #111111
        S1.forEach(function (w, i) {
          var cue = w[1], t0 = cue - 0.06, el = s1.querySelector('.mx-w[data-i="' + i + '"]');
          if (w[2] === "box") {
            var tx = el.querySelector(".mx-box-tx");
            ft(el.querySelector(".mx-box-bg"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, cue - 0.066);   // frame.md « power3.out »
            ft(tx, { opacity: 0, y: 8, filter: "blur(6px)", color: GREY_B }, { opacity: 1, y: 0, filter: "blur(0px)", color: GREY_B, duration: 0.14, ease: "power2.out" }, t0);
            ft(tx, { color: GREY_B }, { color: BOX, duration: 0.1, ease: "none" }, cue + 0.04);
            return;
          }
          ft(el, { opacity: 0, y: 8, filter: "blur(6px)", color: GREY_N }, { opacity: 1, y: 0, filter: "blur(0px)", color: GREY_N, duration: 0.14, ease: "power2.out" }, t0);
          ft(el, { color: GREY_N }, { color: INK_N, duration: 0.2, ease: "power1.out" }, t0 + 0.14);
        });
        ft(s1, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.10);

        tl.set({}, {}, DUR);                                            // exact frame length

        render(T0);                                                     // first image = handoff_in, before any seek

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
</template>
