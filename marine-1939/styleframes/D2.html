</svg><div style="position:absolute;left:780px;top:120px;width:1250px;height:833px;transform:rotate(-8deg);transform-origin:50% 50%"><div style="position:absolute;inset:-16px -24px -34px -24px;background:#3b2a1c;border-radius:10px;box-shadow:26px 44px 64px rgba(10,6,2,.7)"></div><div style="position:absolute;left:6px;right:6px;top:833px;height:5px;background:#ded2b6;border-radius:0 0 4px 4px"></div><div style="position:absolute;left:9px;right:9px;top:837px;height:5px;background:#d2c5a6;border-radius:0 0 4px 4px"></div><div style="position:absolute;left:12px;right:12px;top:841px;height:5px;background:#c6b896;border-radius:0 0 4px 4px"></div><svg viewBox="0 0 1920 2560" width="625" height="833" style="position:absolute;top:0;left:0"><rect width="1920" height="2560" fill="#efe5cf"/><rect width="1920" height="2560" filter="url(#paper)" opacity=".38" style="mix-blend-mode:multiply"/><g filter="url(#ink)"><text x="214" y="330" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">Au sortir de la Grande Guerre, la Marine nationale entreprend de</text><text x="214" y="404" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">se reconstruire. Les programmes navals votés à partir de 1922</text><text x="214" y="478" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">lui donnent, en moins de vingt ans, une flotte presque</text><text x="214" y="552" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">entièrement neuve : croiseurs lourds et légers,</text><text x="214" y="626" font-family="EB Garamond" font-size="50" fill="#2a2620">contre-torpilleurs, torpilleurs et sous-marins.</text><text x="214" y="740.7" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">En 1939, deux cuirassés rapides, le Dunkerque et le Strasbourg,</text><text x="214" y="814.7" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">ont rejoint l’escadre ; le Richelieu et le Jean Bart sont en</text><text x="214" y="888.7" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">achèvement. Les vieux cuirassés de la Grande Guerre, modernisés,</text><text x="214" y="962.7" font-family="EB Garamond" font-size="50" fill="#2a2620">restent en ligne.</text><text x="214" y="1077.4" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">Les équipages sont des engagés et des inscrits maritimes, venus</text><text x="214" y="1151.4" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">pour beaucoup de Bretagne et de Provence. Les bases de Brest,</text><text x="214" y="1225.4" font-family="EB Garamond" font-size="50" fill="#2a2620">Toulon et Bizerte tiennent les deux mers.</text></g><text x="214" y="2440" text-anchor="start" font-family="EB Garamond" font-size="44" fill="#8a8172">214</text></svg><svg viewBox="0 0 1920 2560" width="625" height="833" style="position:absolute;top:0;right:0"><defs><filter id="paper" x="0" y="0" width="100%" height="100%">

<text x="214" y="1240" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">En septembre 1939, la Marine nationale est la quatrième flotte</text><text x="214" y="1314" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">du monde, derrière la Royal Navy, l’US Navy et la Marine</text><text x="214" y="1388" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">impériale japonaise. Ses contre-torpilleurs comptent parmi les</text><text x="214" y="1462" font-family="EB Garamond" font-size="50" fill="#2a2620">navires les plus rapides de leur temps.</text><text x="214" y="1576.7" font-family="EB Garamond" font-size="50" fill="#2a2620" textLength="1492" lengthAdjust="spacing">L’armistice de juin 1940 la laisse presque intacte. Son sort</text><text x="214" y="1650.7" font-family="EB Garamond" font-size="50" fill="#2a2620">devient alors l’un des enjeux de la guerre en Méditerranée.</text></g><text x="1706" y="2440" text-anchor="end" font-family="EB Garamond" font-size="44" fill="#8a8172">215</text><g transform="rotate(-6 1540 640)"><text x="1540" y="860" text-anchor="middle" font-family="Archivo Black" font-size="560" fill="#1b1a17" transform="translate(20 20)">4<tspan font-size="230" dy="-300">e</tspan></text><text x="1540" y="860" text-anchor="middle" font-family="Archivo Black" font-size="560" fill="#e6ec37">4<tspan font-size="230" dy="-300">e</tspan></text></g></svg><div style="position:absolute;left:515px;top:0;width:220px;height:833px;background:linear-gradient(90deg,rgba(60,40,15,0),rgba(60,40,15,.32) 40%,rgba(30,20,8,.62) 50%,rgba(60,40,15,.32) 60%,rgba(60,40,15,0))"></div></div><svg style="position:absolute;left:2700px;top:1030px;overflow:visible" width="1" height="1"><defs><filter id="dsD20" x="-30%" y="-60%" width="160%" height="220%"><feDropShadow dx="9" dy="13" stdDeviation="7" flood-color="#1a1008" flood-opacity=".55"/></filter></def
